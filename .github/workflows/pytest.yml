name: Pytest

on:
  # NO push trigger. Pass 1 runs the WHOLE suite against a real LLM for ~50
  # minutes and bills Prasad's own key, and it fired on every merge to main:
  # three full runs in two days on 2026-10-04/05, one per ship, when one per
  # RELEASE is what is actually needed. `ops ship` now dispatches this
  # workflow explicitly and waits for it, so the release gate is unchanged.
  # A nightly run keeps main honest between releases.
  schedule:
    - cron: "17 9 * * *"  # 09:17 UTC daily
  # NO pull_request trigger. `ready_for_review` used to fire the whole suite,
  # so marking a draft ready cost a full run and merging it cost another
  # (#1169 on 2026-10-02 did exactly that). Opening a non-draft PR never
  # triggered this workflow anyway, so the signal lost is small, and the gate
  # that matters runs on main below — `ops ship` refuses to release on red.
  # Run it on a branch by hand when you want it:
  #   gh workflow run Pytest --ref <branch>
  # (without --ref, gh dispatches against the remote default branch).
  workflow_dispatch:


jobs:
  # Two-minute gate in front of the paid suite. On 2026-10-05 a run spent the
  # full 50 minutes and then failed on six MOCKED tests -- a collection error
  # or a broken no-LLM test should never cost an LLM suite to discover.
  quick:
    if: "contains(github.event.head_commit.message, 'notest') == false"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Same extras as the paid job: with core-only deps, collection fails on
      # missing optional imports (fitz, sqlalchemy, neo4j, arango) and the gate
      # would cry wolf. Installing costs Actions minutes, not LLM calls.
      - name: Install project dependencies with uv
        run: |
          uv sync --dev \
            --extra neo4j \
            --extra arango \
            --extra lancedb \
            --extra meilisearch \
            --extra chromadb \
            --extra docling \
            --extra litellm \
            --extra pymupdf4llm \
            --extra weaviate \
            --extra pinecone \
            --extra milvus \
            --extra postgres\
            --extra hf-embeddings \
            --extra unstructured \
            --extra pdf-parsers \
            --extra docx \
            --extra sql \
            --extra exa \
            --extra tavily \
            --extra firecrawl \
            --extra fastembed \
            --extra crawl4ai
          
      - name: Collect every test (catches import and collection errors)
        env:
          PYTEST_ADDOPTS: "-p no:logging"
        run: uv run pytest tests/main --collect-only -q --ct fakeredis
      - name: Run the tests that need no LLM
        env:
          PYTEST_ADDOPTS: "-p no:logging"
        run: |
          uv run pytest -q --ct fakeredis \
            tests/main/test_model_info.py \
            tests/main/test_vertexai_isolation.py \
            tests/main/test_vertexai_routing.py \
            tests/main/test_global_settings.py \
            tests/main/test_graph.py

  cancel:
    if: "contains(github.event.head_commit.message, 'notest') == false"
    name: Cancel Previous Runs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel Previous Workflow Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}
  pytest:
    needs: quick
    if: "contains(github.event.head_commit.message, 'notest') == false"
    runs-on: ubuntu-latest
    services:
      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 7700:7700
        options: --env MEILI_MASTER_KEY=masterKey
      arangodb:
        image: arangodb:latest
        ports:
          - 8529:8529
        env:
          ARANGO_ROOT_PASSWORD: rootpassword
      neo4j:
        image: neo4j:latest
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/password
      weaviate:
        image: semitechnologies/weaviate:latest
        ports:
          - "8080:8080"
          - "50051:50051"  # Add gRPC port
        env:
          WEAVIATE_IN_MEMORY: "true"
          QUERY_DEFAULTS_LIMIT: "25"
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          ENABLE_MODULES: "text2vec-openai"
          CLUSTER_HOSTNAME: "node1"
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langroid 
        ports:
          - "5432:5432"
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports:
          - "6333:6333"
        env:
          QDRANT__SERVICE__API_KEY: local-dev-key


    env:
      CI: true # allows conditional skipping of tests based on this env var
      TEST_MCP_NPX: true # allow NPX MCP tests
      OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      # Point Qdrant tests at the local `qdrant` service container (defined
      # above), NOT Qdrant Cloud, to avoid ongoing cloud-cluster billing.
      # The cloud secrets are intentionally bypassed; restore them here if
      # cloud-specific testing is ever needed again.
      QDRANT_API_KEY: local-dev-key
      QDRANT_API_URL: http://localhost:6333
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
      WEAVIATE_API_URL: ${{ secrets.WEAVIATE_API_URL }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LANGDB_API_KEY: ${{ secrets.LANGDB_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langroid 

      # Azure OpenAI env vars
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_BASE: ${{ secrets.AZURE_OPENAI_API_BASE }}
      AZURE_OPENAI_API_VERSION: "2023-05-15"
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_OPENAI_MODEL_NAME: ${{ secrets.AZURE_GPT_MODEL_NAME }} 
      AZURE_OPENAI_MODEL_VERSION: ${{ secrets.AZURE_OPENAI_MODEL_VERSION }}
      
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
    - name: Free disk space (remove SDKs and prune Docker)
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
        docker system prune -af
        docker volume prune -f
        df -h
        docker system df
    - name: Increase ulimit
      run: ulimit -n 4096
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11  # Replace with your desired Python version

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1
        sudo apt-get install -y poppler-utils tesseract-ocr
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
    # - name: Restore uv cache 
    #   uses: actions/cache@v4
    #   with: 
    #     path: ~/.local
    #     key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
    #     restore-keys: |
    #       uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
    #       uv-${{ runner.os }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with: 
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # - name: Load cached venv
    #   id: cached-uv-dependencies
    #   uses: actions/cache@v4
    #   with:
    #       path: .venv
    #       key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock') }}
    
    - name: Install project dependencies with uv
      # if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
      run: |
        uv sync --dev \
          --extra neo4j \
          --extra arango \
          --extra lancedb \
          --extra meilisearch \
          --extra chromadb \
          --extra docling \
          --extra litellm \
          --extra pymupdf4llm \
          --extra weaviate \
          --extra pinecone \
          --extra milvus \
          --extra postgres\
          --extra hf-embeddings \
          --extra unstructured \
          --extra pdf-parsers \
          --extra docx \
          --extra sql \
          --extra exa \
          --extra tavily \
          --extra firecrawl \
          --extra fastembed \
          --extra crawl4ai
        
      
    

    - name: Download minimal NLTK data
      run: |
        uv run python - <<'PY'
        import nltk
        for pkg in [
            "punkt",            # tokenization
            "punkt_tab",        # tokenization (NLTK >=3.9 renamed punkt)
            "stopwords",        # stopword removal
            "wordnet",          # lemmatization
            "omw-1.4",          # wordnet data
            "gutenberg",        # sample corpus used in tests
        ]:
            nltk.download(pkg)
        PY

    - name: Dump dependencies to file
      run: uv pip freeze > requirements_github.txt

    - name: Upload dependencies file
      uses: actions/upload-artifact@v4
      with:
        name: github-dependencies
        path: requirements_github.txt


    - name: Run ALL tests with coverage (GPT-4o-mini)
      id: first_test
      env:
        PYTEST_ADDOPTS: "-p no:logging"
      run: |
        uv run pytest --m gpt-4o-mini --cov langroid --cov-config .coveragerc \
          -rf -vv --log-cli-level=INFO --show-capture=no \
          -n auto --timeout=300 \
          --first-test-file=tests/main/sql_chat/test_sql_chat_agent.py \
          --first-test-file=tests/extras/test_hf_embeddings.py \
          --first-test-file=tests/extras/test_gemini_embeddings.py \
          --first-test-file=tests/extras/test_fastembed_embeddings.py \
          --first-test-file=tests/main/test_llm.py \
          --first-test-file=tests/main/test_task.py \
          --first-test-file=tests/main/test_llm_async.py \
          --first-test-file=tests/main/test_task_inf_loop.py \
          --first-test-file=tests/main/test_lance_doc_chat_agent.py \
          --first-test-file=tests/main/test_gemini_doc_parser.py \
          tests/main
      continue-on-error: true

    - name: Retry FAILED tests ONLY with GPT-4o instead of GPT-4o-mini
      id: second_test
      if: steps.first_test.outcome == 'failure'
      env:
        PYTEST_ADDOPTS: "-p no:logging"
      run: |
        uv run pytest --m gpt-4o --cov langroid --cov-append --cov-config .coveragerc \
          -rf -vv --log-cli-level=INFO --show-capture=no \
          -n auto --timeout=300 \
          --first-test-file=tests/main/sql_chat/test_sql_chat_agent.py \
          --first-test-file=tests/main/test_llm.py \
          --first-test-file=tests/main/test_task.py \
          --first-test-file=tests/main/test_llm_async.py \
          --first-test-file=tests/main/test_task_inf_loop.py \
          --first-test-file=tests/main/test_lance_doc_chat_agent.py \
          --lf --last-failed-no-failures none \
          tests/main tests/extras/test_hf_embeddings.py \
          tests/extras/test_fastembed_embeddings.py
      continue-on-error: true

    - name: Retry FAILED tests ONLY without cache (GPT-4o)
      id: third_test
      if: steps.second_test.outcome == 'failure'
      env:
        PYTEST_ADDOPTS: "-p no:logging"
      run: |
        uv run pytest --m gpt-4o --nc --cov langroid --cov-append --cov-config .coveragerc \
          --junitxml=test-results.xml \
          -rf --show-capture=no --timeout=300 -n auto \
          --first-test-file=tests/main/sql_chat/test_sql_chat_agent.py \
          --first-test-file=tests/main/test_llm.py \
          --first-test-file=tests/main/test_llm_async.py \
          --first-test-file=tests/main/test_task_inf_loop.py \
          --first-test-file=tests/main/test_task.py \
          --first-test-file=tests/main/test_lance_doc_chat_agent.py \
          --lf --last-failed-no-failures none \
          tests/main tests/extras/test_hf_embeddings.py \
          tests/extras/test_fastembed_embeddings.py
    - name: Generate final coverage report from all runs
      run: uv run coverage report

    - name: Generate XML coverage report
      run: uv run coverage xml
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: "test-results.xml"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
